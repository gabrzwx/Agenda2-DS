<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Colaborador</title>
</head>

<body>

    <h1>Cadastro de Colaborador</h1>

    <form action="processaCadastro.php" method="POST">

        <label for="nome1">Nome completo:</label>
        <input type="text" id="nome1" name="nome1">

        <br><br>

        <label for="idade2">Idade:</label>
        <input type="number" id="idade2" name="idade2">

        <br><br>

        <label for="profissao3">Profissão:</label>
        <input type="text" id="profissao3" name="profissao3">

        <br><br>

        <label for="salario4">Salário pretendido:</label>
        <input type="number" id="salario4" name="salario4" step="0.01">

        <br><br>

        <label for="experiencia5">Experiência anterior:</label>
        <br>
        <textarea id="experiencia5" name="experiencia5" rows="6" cols="50"></textarea>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
